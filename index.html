<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eceff1"><meta name="apple-mobile-web-app-capable" content="yes">
<title>خريطتي</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.css">
<style>
:root{--g:#0b7d47;--b:#1a73e8;--ink:#202124}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:var(--ink)}
#map{position:fixed;inset:0}
.top{position:fixed;inset:calc(10px + env(safe-area-inset-top,0px)) 10px auto 10px;z-index:5}
#q{width:100%;border:0;border-radius:26px;padding:14px 18px;font-size:16px;box-shadow:0 2px 12px #0003;outline:0}
#res{background:#fff;border-radius:16px;margin-top:6px;box-shadow:0 4px 18px #0003;overflow:hidden}
#res div{padding:12px 16px;border-bottom:1px solid #eee;font-size:14px}#res small{display:block;color:#5f6368}
.fab{position:fixed;left:12px;z-index:5;width:48px;height:48px;border-radius:50%;border:0;background:#fff;box-shadow:0 2px 10px #0003;font-size:22px}
#loc{bottom:calc(190px + env(safe-area-inset-bottom,0px))}
.sheet{position:fixed;inset:auto 0 0 0;z-index:6;background:#fff;border-radius:22px 22px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 24px #0003;transform:translateY(110%);transition:transform .35s}
.sheet.on{transform:none}.sheet h3{margin:0 0 4px;font-size:19px}.sheet p{margin:2px 0 10px;color:#5f6368;font-size:14px}
.modes{display:flex;gap:8px;margin-bottom:10px}.modes button{flex:1;padding:8px;border-radius:12px;border:1px solid #dadce0;background:#fff;font-size:14px}.modes .a{background:#e8f0fe;border-color:var(--b);color:var(--b)}
.btn{border:0;border-radius:24px;padding:12px 22px;font-size:16px;background:var(--b);color:#fff;margin-inline-end:8px}.btn.o{background:#e8f0fe;color:var(--b)}
#ban{position:fixed;inset:calc(10px + env(safe-area-inset-top,0px)) 10px auto 10px;z-index:7;background:var(--g);color:#fff;border-radius:16px;padding:12px 16px;display:none;align-items:center;gap:14px;box-shadow:0 4px 16px #0004}
#ban b{font-size:40px;line-height:1}#ban span{font-size:20px;font-weight:600}#ban small{display:block;opacity:.85;font-size:14px}
#nav{position:fixed;inset:auto 0 0 0;z-index:7;background:#fff;border-radius:22px 22px 0 0;padding:14px 18px calc(16px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;align-items:center;box-shadow:0 -4px 24px #0003}
#nav strong{font-size:22px;color:var(--g)}#nav button{border:0;border-radius:22px;background:#d93025;color:#fff;padding:10px 20px;font-size:15px}
#rr{position:fixed;top:50%;left:50%;transform:translateX(-50%);z-index:8;background:#fff;border-radius:20px;padding:8px 16px;box-shadow:0 2px 10px #0003;display:none}
.me{width:20px;height:20px;border-radius:50%;background:var(--b);border:3px solid #fff;box-shadow:0 0 0 8px #1a73e833,0 2px 6px #0005}
</style></head><body>
<div id="map"></div>
<div class="top"><input id="q" placeholder="ابحث عن مكان…" enterkeyhint="search"><div id="res" hidden></div></div>
<button class="fab" id="loc" aria-label="موقعي">◎</button>
<div class="sheet" id="sheet"><h3 id="pn"></h3><p id="pa"></p>
<div class="modes" id="modes"><button data-m="car" class="a">🚗 سيارة</button><button data-m="bike">🚲 دراجة</button><button data-m="foot">🚶 مشي</button></div>
<p id="info"></p><button class="btn" id="go">المسار</button><button class="btn o" id="sim" hidden>تجربة</button><button class="btn" id="start" hidden style="background:var(--g)">ابدأ</button></div>
<div id="ban"><b id="ic">↑</b><div><span id="st"></span><small id="di"></small></div></div>
<div id="rr">⟳ إعادة حساب المسار…</div>
<div id="nav"><div><strong id="eta"></strong><br><small id="rem"></small></div><button id="stop">إنهاء</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.min.js"></script>
<script>
const $=i=>document.getElementById(i);
const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',center:[46.68,24.71],zoom:12,pitch:50,bearing:-15,attributionControl:{compact:true}});
const SRV={car:'routed-car',bike:'routed-bike',foot:'routed-foot'};
let me=null,meMk=null,dest=null,destMk=null,mode='car',route=null,steps=[],si=0,nav=false,sim=null,watch=null,prev=null,heading=0,rerouting=false;
map.on('load',()=>{
  const l=map.getStyle().layers.find(x=>x.type==='symbol')?.id;
  map.addLayer({id:'b3d',type:'fill-extrusion',source:'openmaptiles','source-layer':'building',minzoom:13,
    paint:{'fill-extrusion-color':['interpolate',['linear'],['get','render_height'],0,'#f6f6f4',60,'#e6e8ea'],
    'fill-extrusion-height':['coalesce',['get','render_height'],6],'fill-extrusion-base':['coalesce',['get','render_min_height'],0],'fill-extrusion-opacity':.95}},l);
  map.addSource('r',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
  map.addLayer({id:'rc',type:'line',source:'r',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#fff','line-width':11}});
  map.addLayer({id:'rl',type:'line',source:'r',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#1a73e8','line-width':7}});
  locate(true);
});
// ---- location
function onPos(p){
  if(prev&&dist([prev.lng,prev.lat],[p.lng,p.lat])>4){heading=bearing(prev,p);prev=p}else if(!prev)prev=p;
  if(p.heading!=null&&!isNaN(p.heading))heading=p.heading;
  me=p;if(!meMk){const e=document.createElement('div');e.className='me';meMk=new maplibregl.Marker({element:e}).setLngLat([p.lng,p.lat]).addTo(map)}
  meMk.setLngLat([p.lng,p.lat]);if(nav)follow();
}
function locate(first){
  if(!navigator.geolocation)return;
  if(watch!=null)return first?0:map.easeTo({center:[me.lng,me.lat],zoom:15});
  watch=navigator.geolocation.watchPosition(g=>{const f=!me;onPos({lat:g.coords.latitude,lng:g.coords.longitude,heading:g.coords.heading});if(f)map.jumpTo({center:[me.lng,me.lat],zoom:15})},()=>{},{enableHighAccuracy:true,maximumAge:1000});
}
$('loc').onclick=()=>me?map.easeTo({center:[me.lng,me.lat],zoom:16,pitch:55}):locate();
// ---- search
let tm;$('q').oninput=e=>{clearTimeout(tm);const v=e.target.value.trim();if(v.length<3){$('res').hidden=true;return}
  tm=setTimeout(async()=>{try{const c=map.getCenter();
    const r=await(await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&accept-language=ar,en&viewbox=${c.lng-.5},${c.lat+.5},${c.lng+.5},${c.lat-.5}&q=${encodeURIComponent(v)}`)).json();
    $('res').innerHTML='';r.forEach(x=>{const d=document.createElement('div');const n=x.name||x.display_name.split(',')[0];d.innerHTML=`${n}<small>${x.display_name}</small>`;
      d.onclick=()=>pick(+x.lat,+x.lon,n,x.display_name);$('res').append(d)});
    $('res').hidden=!r.length;if(!r.length){$('res').hidden=false;$('res').innerHTML='<div>ما لقيت نتائج</div>'}}catch(e){}},450)};
function pick(lat,lng,n,a){dest={lat,lng,n};$('res').hidden=true;$('q').blur();$('pn').textContent=n;$('pa').textContent=a;$('info').textContent='';
  $('go').hidden=false;$('start').hidden=$('sim').hidden=true;$('sheet').classList.add('on');
  destMk?.remove();destMk=new maplibregl.Marker({color:'#d93025'}).setLngLat([lng,lat]).addTo(map);map.flyTo({center:[lng,lat],zoom:16,pitch:55,speed:.9});clearRoute()}
map.on('click',e=>{if(nav)return;pick(e.lngLat.lat,e.lngLat.lng,'الموقع المحدد',`${e.lngLat.lat.toFixed(5)}, ${e.lngLat.lng.toFixed(5)}`)});
$('modes').onclick=e=>{const m=e.target.dataset.m;if(!m)return;mode=m;[...$('modes').children].forEach(b=>b.classList.toggle('a',b.dataset.m===m));if(route)getRoute()};
function clearRoute(){route=null;map.getSource('r')?.setData({type:'FeatureCollection',features:[]})}
// ---- routing
async function getRoute(quiet){
  const from=me||{lat:map.getCenter().lat,lng:map.getCenter().lng};
  try{const r=await(await fetch(`https://routing.openstreetmap.de/${SRV[mode]}/route/v1/driving/${from.lng},${from.lat};${dest.lng},${dest.lat}?overview=full&geometries=geojson&steps=true`)).json();
    if(!r.routes?.length){$('info').textContent='ما لقيت مسار';return false}
    route=r.routes[0];steps=route.legs[0].steps;si=0;
    map.getSource('r').setData({type:'Feature',geometry:route.geometry});
    const m=Math.round(route.duration/60),k=(route.distance/1000).toFixed(1);
    $('info').textContent=`${m>=60?Math.floor(m/60)+' س ':''}${m%60} د · ${k} كم`;$('start').hidden=$('sim').hidden=false;$('go').hidden=true;
    if(!quiet){const b=new maplibregl.LngLatBounds();route.geometry.coordinates.forEach(c=>b.extend(c));map.fitBounds(b,{padding:{top:90,bottom:260,left:40,right:40},pitch:0,bearing:0})}
    return true}catch(e){$('info').textContent='تعذر الاتصال بخدمة المسارات';return false}
}
$('go').onclick=()=>getRoute();
// ---- navigation
const AR={left:'انعطف يسارًا',right:'انعطف يمينًا',straight:'استمر مباشرة','slight left':'ميل قليلًا يسارًا','slight right':'ميل قليلًا يمينًا','sharp left':'انعطف بحدة يسارًا','sharp right':'انعطف بحدة يمينًا',uturn:'استدر للخلف'};
const IC={left:'↰',right:'↱',straight:'↑','slight left':'↖','slight right':'↗','sharp left':'↰','sharp right':'↱',uturn:'↶'};
function stepText(s){const m=s.maneuver;if(m.type==='arrive')return['⚑','وصلت إلى وجهتك'];if(m.type==='depart')return['↑','انطلق'];
  if(m.type==='roundabout'||m.type==='rotary')return['⟳','ادخل الدوار'];return[IC[m.modifier]||'↑',(AR[m.modifier]||'استمر')+(s.name?' إلى '+s.name:'')]}
function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';speechSynthesis.speak(u)}catch(e){}}
function startNav(){nav=true;$('sheet').classList.remove('on');$('ban').style.display='flex';$('nav').style.display='flex';$('top')?.remove();document.querySelector('.top').style.display='none';$('loc').style.display='none';showStep(true);follow()}
$('start').onclick=startNav;
$('sim').onclick=()=>{if(sim)return;const c=route.geometry.coordinates;let d=0,i=0;const tot=route.distance;prev=null;
  startNav();sim=setInterval(()=>{d+=22*.1*1.4;if(d>=tot){stopNav();return}
    let acc=0;for(i=0;i<c.length-1;i++){const s=dist(c[i],c[i+1]);if(acc+s>=d)break;acc+=s}
    const t=(d-acc)/(dist(c[i],c[i+1])||1),a=c[i],b=c[Math.min(i+1,c.length-1)];
    const p={lng:a[0]+(b[0]-a[0])*t,lat:a[1]+(b[1]-a[1])*t};p.heading=bearing({lng:a[0],lat:a[1]},{lng:b[0],lat:b[1]});onPos(p)},100)};
function follow(){if(!me)return;map.easeTo({center:[me.lng,me.lat],bearing:heading,pitch:62,zoom:17.2,duration:600,easing:t=>t,padding:{top:260,bottom:0,left:0,right:0}});update()}
let lastSpoken=-1;
function showStep(speakIt){const s=steps[Math.min(si+1,steps.length-1)];const[i,t]=stepText(s);$('ic').textContent=i;$('st').textContent=t;if(speakIt)speak(t)}
function update(){if(!route||!me)return;
  const nx=steps[Math.min(si+1,steps.length-1)],d=dist([me.lng,me.lat],nx.maneuver.location);
  $('di').textContent=d>=1000?(d/1000).toFixed(1)+' كم':Math.round(d/10)*10+' م';
  if(d<25&&si<steps.length-1){si++;if(si>=steps.length-1){speak('وصلت إلى وجهتك');setTimeout(stopNav,2500);return}showStep(true);lastSpoken=-1}
  else if(d<150&&lastSpoken!==si){lastSpoken=si;speak('بعد '+Math.round(d/10)*10+' متر، '+stepText(nx)[1])}
  let rem=d;for(let k=si+2;k<steps.length;k++)rem+=steps[k].distance;
  $('rem').textContent=(rem/1000).toFixed(1)+' كم';$('eta').textContent=new Date(Date.now()+rem/route.distance*route.duration*1000).toLocaleTimeString('ar',{hour:'2-digit',minute:'2-digit'});
  if(!sim&&!rerouting&&offRoute()>70){rerouting=true;$('rr').style.display='block';getRoute(true).then(()=>{rerouting=false;$('rr').style.display='none';showStep(true)})}}
function offRoute(){const c=route.geometry.coordinates;let m=1e9;for(let i=0;i<c.length-1;i++){m=Math.min(m,segDist([me.lng,me.lat],c[i],c[i+1]))}return m}
function stopNav(){nav=false;clearInterval(sim);sim=null;$('ban').style.display=$('nav').style.display='none';document.querySelector('.top').style.display='';$('loc').style.display='';
  $('sheet').classList.add('on');map.easeTo({pitch:50,bearing:0,padding:{top:0},duration:800});speechSynthesis?.cancel()}
$('stop').onclick=stopNav;
// ---- geo helpers (meters)
function dist(a,b){const R=6371000,r=Math.PI/180,dl=(b[1]-a[1])*r,dn=(b[0]-a[0])*r;const x=Math.sin(dl/2)**2+Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function bearing(a,b){const r=Math.PI/180,y=Math.sin((b.lng-a.lng)*r)*Math.cos(b.lat*r),x=Math.cos(a.lat*r)*Math.sin(b.lat*r)-Math.sin(a.lat*r)*Math.cos(b.lat*r)*Math.cos((b.lng-a.lng)*r);return(Math.atan2(y,x)/r+360)%360}
function segDist(p,a,b){const k=Math.cos(p[1]*Math.PI/180),X=v=>(v[0]-p[0])*k*111320,Y=v=>(v[1]-p[1])*111320;
  const ax=X(a),ay=Y(a),bx=X(b),by=Y(b),dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?Math.max(0,Math.min(1,-(ax*dx+ay*dy)/l)):0;return Math.hypot(ax+t*dx,ay+t*dy)}
</script></body></html>
