<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="أغاني">
<title>أغاني</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--ink:#f1f3f5;--dim:#8b93a1;--a:#ff5a4f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px}
.row{display:flex;gap:10px;align-items:center}
h1{margin:0;font-size:26px;flex:1}
.add{background:var(--a);color:#fff;border:0;border-radius:22px;padding:10px 18px;font-size:15px;font-weight:600}
#q{width:100%;margin-top:12px;border:0;border-radius:14px;background:var(--card);color:var(--ink);padding:12px 16px;font-size:16px;outline:0}
#list{padding:4px 10px 230px}
.s{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:14px}
.s.on{background:var(--card)}.s.on .n{color:var(--a)}
.s .i{width:42px;height:42px;border-radius:10px;background:var(--card);display:grid;place-items:center;font-size:18px;flex:none}
.s.on .i{background:#ff5a4f26}
.s .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.s small{color:var(--dim);display:block;margin-top:2px;font-size:12px}
.s .x{background:none;border:0;color:var(--dim);font-size:20px;padding:6px 10px}
.empty{text-align:center;color:var(--dim);padding:70px 30px;line-height:1.9}
#bar{position:fixed;inset:auto 0 0 0;background:#161920;border-radius:24px 24px 0 0;padding:16px 20px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 30px #0008}
#t{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;min-height:24px}
#seek{width:100%;margin:12px 0 2px;accent-color:var(--a);direction:ltr}
.tm{display:flex;justify-content:space-between;color:var(--dim);font-size:12px;direction:ltr}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:8px;direction:ltr}
.ctl button{background:none;border:0;color:var(--ink);font-size:26px;padding:8px 12px}
.ctl .m{color:var(--dim);font-size:22px}.ctl .m.on{color:var(--a)}
.ctl .p{background:var(--a);border-radius:50%;width:64px;height:64px;font-size:26px;padding:0}
</style></head><body>
<header><div class="row"><h1>أغاني</h1><button class="add" id="add">+ أضف أغاني</button></div>
<input id="q" placeholder="ابحث في أغانيك…" type="search"></header>
<input type="file" id="f" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg" multiple hidden>
<div id="list"></div>
<div id="bar"><div id="t">اختر أغنية</div><input type="range" id="seek" min="0" max="1000" value="0">
<div class="tm"><span id="c">0:00</span><span id="d">0:00</span></div>
<div class="ctl"><button class="m" id="rep" aria-label="تكرار">↻</button><button id="prev" aria-label="السابقة">⏮</button><button class="p" id="pp" aria-label="تشغيل">▶</button><button id="next" aria-label="التالية">⏭</button><button class="m" id="shf" aria-label="عشوائي">⤮</button></div></div>
<audio id="a" preload="metadata"></audio>
<script>
const $=i=>document.getElementById(i),a=$('a');
let songs=[],cur=-1,shuf=false,rep=0,url=null,db;
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('music',1);r.onupgradeneeded=()=>r.result.createObjectStore('songs',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(m,fn)=>new Promise((res,rej)=>{const t=db.transaction('songs',m),s=t.objectStore('songs'),r=fn(s);t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)});
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const clean=n=>n.replace(/\.[^.]+$/,'').replace(/[_]+/g,' ');
async function load(){try{db=await open();songs=await tx('readonly',s=>s.getAll())}catch(e){songs=[]}render()}
function render(){const q=$('q').value.trim().toLowerCase(),L=$('list');L.innerHTML='';
  if(!songs.length){L.innerHTML='<div class="empty">ما عندك أغاني بعد.<br>اضغط «أضف أغاني» واختر ملفات من الجوال.<br>تنحفظ في المتصفح وتبقى لك.</div>';return}
  songs.forEach((s,i)=>{if(q&&!s.name.toLowerCase().includes(q))return;
    const d=document.createElement('div');d.className='s'+(i===cur?' on':'');
    d.innerHTML=`<div class="i">${i===cur&&!a.paused?'♪':'♫'}</div><div class="n"></div><button class="x" aria-label="حذف">✕</button>`;
    d.querySelector('.n').innerHTML=`<span></span><small>${(s.size/1048576).toFixed(1)} MB</small>`;d.querySelector('.n span').textContent=clean(s.name);
    d.onclick=e=>{if(e.target.classList.contains('x'))return;play(i)};
    d.querySelector('.x').onclick=async()=>{if(!confirm('حذف «'+clean(s.name)+'»؟'))return;await tx('readwrite',st=>st.delete(s.id));
      if(i===cur){a.pause();a.removeAttribute('src');cur=-1;$('t').textContent='اختر أغنية'}else if(i<cur)cur--;songs.splice(i,1);render()};
    L.append(d)})}
function play(i){if(i<0||i>=songs.length)return;cur=i;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(songs[i].blob);a.src=url;a.play().catch(()=>{});
  $('t').textContent=clean(songs[i].name);
  if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:clean(songs[i].name),artist:'أغاني'})}
  render()}
function next(auto){if(!songs.length)return;if(auto&&rep===2){a.currentTime=0;a.play();return}
  let n;if(shuf&&songs.length>1){do{n=Math.random()*songs.length|0}while(n===cur)}else{n=cur+1;if(n>=songs.length){if(rep===1||!auto)n=0;else{a.pause();return}}}play(n)}
function prev(){if(a.currentTime>3){a.currentTime=0;return}play(cur<=0?songs.length-1:cur-1)}
$('add').onclick=()=>$('f').click();
$('f').onchange=async e=>{const fs=[...e.target.files];for(const f of fs){try{const id=await tx('readwrite',s=>s.add({name:f.name,size:f.size,blob:f}));}catch(err){alert('تعذر حفظ '+f.name)}}
  e.target.value='';await load()};
$('q').oninput=render;
$('pp').onclick=()=>{if(cur<0){if(songs.length)play(0);return}a.paused?a.play():a.pause()};
$('next').onclick=()=>next(false);$('prev').onclick=prev;
$('shf').onclick=()=>{shuf=!shuf;$('shf').classList.toggle('on',shuf)};
$('rep').onclick=()=>{rep=(rep+1)%3;$('rep').classList.toggle('on',rep>0);$('rep').textContent=rep===2?'↻1':'↻'};
a.onplay=()=>{$('pp').textContent='❚❚';render()};a.onpause=()=>{$('pp').textContent='▶'};
a.onended=()=>next(true);
a.ontimeupdate=()=>{if(!seeking&&a.duration){$('seek').value=a.currentTime/a.duration*1000}$('c').textContent=fmt(a.currentTime);$('d').textContent=fmt(a.duration)};
let seeking=false;$('seek').oninput=()=>{seeking=true;$('c').textContent=fmt($('seek').value/1000*a.duration)};
$('seek').onchange=()=>{if(a.duration)a.currentTime=$('seek').value/1000*a.duration;seeking=false};
if('mediaSession'in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>a.play());m.setActionHandler('pause',()=>a.pause());m.setActionHandler('nexttrack',()=>next(false));m.setActionHandler('previoustrack',prev);
  try{m.setActionHandler('seekto',d=>{a.currentTime=d.seekTime})}catch(e){}}
if(navigator.storage?.persist)navigator.storage.persist();
load();
</script></body></html>
