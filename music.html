<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="أغاني">
<title>أغاني</title>
<style>
:root{--bg:#000;--card:#161616;--ink:#fff;--dim:#8a8a8a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
svg{display:block}
header{position:sticky;top:0;z-index:2;background:var(--bg);padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px}
.row{display:flex;gap:10px;align-items:center}
h1{margin:0;font-size:26px;flex:1}
.add{background:#fff;color:#000;border:0;border-radius:22px;padding:10px 18px;font-size:15px;font-weight:600}
#q{width:100%;margin-top:12px;border:0;border-radius:14px;background:var(--card);color:var(--ink);padding:12px 16px;font-size:16px;outline:0}
#list{padding:4px 10px calc(100px + env(safe-area-inset-bottom,0px))}
.s{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:14px}
.s.on{background:var(--card)}
.s .i{width:42px;height:42px;border-radius:10px;background:var(--card);display:grid;place-items:center;flex:none}
.s.on .i{background:#fff;color:#000}.s .i svg{width:20px;height:20px}
.s .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.s small{color:var(--dim);display:block;margin-top:2px;font-size:12px}
.s .x{background:none;border:0;color:var(--dim);padding:8px 10px;display:grid}.s .x svg{width:18px;height:18px;pointer-events:none}
.empty{text-align:center;color:var(--dim);padding:70px 30px;line-height:1.9}
/* mini bar */
#mini{position:fixed;inset:auto 0 0 0;background:#141414;border-radius:20px 20px 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:none;align-items:center;gap:12px;box-shadow:0 -6px 24px #000a;border-top:1px solid #222}
body.has #mini{display:flex}
#mini .mt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
#mini button{background:#fff;color:#000;border:0;border-radius:50%;width:42px;height:42px;display:grid;place-items:center}#mini button svg{width:20px;height:20px}
#mini .eq{color:#fff}
/* full player */
#pl{position:fixed;inset:0;z-index:10;background:#0d0d0d;direction:ltr;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);overflow:auto}
#pl.on{transform:none}
.hd{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px;border-bottom:1px solid #262626}
.hd b{font-size:22px}.hd button{background:none;border:0;padding:6px}.hd svg{width:28px;height:28px}
.grab{width:44px;height:4px;border-radius:2px;background:#555;margin:0 auto 6px}
.art{margin-top:22px;width:100%;aspect-ratio:16/9;border-radius:16px;background:radial-gradient(circle at 30% 20%,#2a2a2a,#0a0a0a 70%);border:1px solid #262626;display:grid;place-items:center;color:#fff;flex:none}
.art svg{width:64px;height:64px;opacity:.9}
.art .eq{height:56px;gap:7px}.art .eq i{width:9px;border-radius:5px}
body.playing .art svg{display:none}.art .eq{display:none}body.playing .art .eq{display:flex}
#ti{margin:18px 0 0;font-size:28px;font-weight:700;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
#ar{margin-top:6px;color:#9a9a9a;font-size:17px}
.sp{flex:1;min-height:16px}
#tm{color:#9a9a9a;font-size:15px;margin-bottom:10px}
#seek{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;margin:0;--p:0%}
#seek::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(to right,#fff var(--p),#4a4a4a var(--p))}
#seek::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;margin-top:-6.5px}
#seek::-moz-range-track{height:5px;border-radius:3px;background:#4a4a4a}#seek::-moz-range-progress{height:5px;border-radius:3px;background:#fff}
#seek::-moz-range-thumb{width:18px;height:18px;border:0;border-radius:50%;background:#fff}
.ctl{display:flex;align-items:center;justify-content:space-between;margin-top:26px}
.ctl button{background:none;border:0;padding:10px;display:grid;place-items:center}
.ctl svg{width:34px;height:34px}
.ctl .p{background:#262626;border-radius:50%;width:92px;height:92px;padding:0}.ctl .p svg{width:42px;height:42px}
.bt{display:flex;justify-content:space-around;margin-top:34px}
.bt button{background:none;border:0;padding:10px 14px;color:#6f6f6f;display:grid;place-items:center;gap:6px;min-width:58px}
.bt button.on{color:#fff}.bt svg{width:26px;height:26px}.bt .sx{font-weight:700;font-size:17px;height:26px;line-height:26px}
/* equalizer */
.eq{display:flex;gap:3px;align-items:flex-end;height:18px}
.eq i{width:3px;height:6px;background:currentColor;border-radius:2px;animation:eq .9s infinite ease-in-out;animation-play-state:paused}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}.eq i:nth-child(4){animation-delay:-.15s}
body.playing .eq i{animation-play-state:running}
@keyframes eq{0%,100%{height:15%}50%{height:100%}}
@media (prefers-reduced-motion:reduce){.eq i{animation:none;height:60%}#pl{transition:none}}
</style></head><body>
<header><div class="row"><h1>أغاني</h1><button class="add" id="add">+ أضف أغاني</button></div>
<input id="q" placeholder="ابحث في أغانيك…" type="search"></header>
<input type="file" id="f" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg" multiple hidden>
<div id="list"></div>
<div id="mini"><div class="eq"><i></i><i></i><i></i><i></i></div><div class="mt" id="mt"></div><button id="mpp" aria-label="تشغيل"></button></div>
<section id="pl" aria-label="المشغل">
 <div class="grab"></div>
 <div class="hd"><b>أغاني</b><button id="cl" aria-label="إغلاق"></button></div>
 <div class="art"><div class="eq"><i></i><i></i><i></i><i></i></div><span id="nt"></span></div>
 <div id="ti" dir="auto"></div><div id="ar" dir="auto"></div>
 <div class="sp"></div>
 <div id="tm">0:00 / 0:00</div>
 <input type="range" id="seek" min="0" max="1000" value="0">
 <div class="ctl"><button id="prev" aria-label="السابقة"></button><button id="b10" aria-label="رجوع 10 ثواني"></button><button class="p" id="pp" aria-label="تشغيل"></button><button id="f10" aria-label="تقديم 10 ثواني"></button><button id="next" aria-label="التالية"></button></div>
 <div class="bt"><button id="shf" aria-label="عشوائي"></button><button id="rep" aria-label="تكرار"></button><button id="spd" aria-label="السرعة"><span class="sx">1×</span></button><button id="qu" aria-label="القائمة"></button></div>
</section>
<audio id="a" preload="metadata"></audio>
<script>
const $=i=>document.getElementById(i),a=$('a');
const sv=(b,st)=>`<svg viewBox="0 0 24 24" ${st?'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"':'fill="currentColor"'}>${b}</svg>`;
const t10='<text x="12" y="15.4" font-size="7.6" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none" font-family="system-ui,sans-serif">10</text>';
const IC={play:sv('<path d="M8 5v14l11-7z"/>'),pause:sv('<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'),
prev:sv('<path d="M6 5h2.2v14H6zM20 5v14L9 12z"/>'),next:sv('<path d="M15.8 5H18v14h-2.2zM4 5v14l11-7z"/>'),
b10:sv('<path d="M1 4v6h6M3.5 15a9 9 0 1 0 2.1-9.4L1 10"/>'+t10,1),f10:sv('<path d="M23 4v6h-6M20.5 15a9 9 0 1 1-2.1-9.4L23 10"/>'+t10,1),
shuf:sv('<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>',1),
rep:sv('<path d="m17 1 4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/>',1),
rep1:sv('<path d="m17 1 4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3M11 10l1-1v6"/>',1),
qu:sv('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',1),
x:sv('<path d="M6 6l12 12M18 6 6 18"/>',1),dn:sv('<path d="m6 9 6 6 6-6"/>',1),
note:sv('<path d="M9 18V5l12-2v13M9 18a3 3 0 1 1-6 0 3 3 0 0 1 6 0zM21 16a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>',1)};
const EQ='<div class="eq"><i></i><i></i><i></i><i></i></div>';
const set=(id,h)=>$(id).innerHTML=h;
set('prev',IC.prev);set('next',IC.next);set('b10',IC.b10);set('f10',IC.f10);set('pp',IC.play);set('mpp',IC.play);
set('shf',IC.shuf);set('rep',IC.rep);set('qu',IC.qu);set('cl',IC.dn);set('nt',IC.note);
let songs=[],cur=-1,shuf=false,rep=0,url=null,db,seeking=false;const SP=[1,1.25,1.5,2,.75];let si=0;
const open=()=>new Promise((res,rej)=>{const r=indexedDB.open('music',1);r.onupgradeneeded=()=>r.result.createObjectStore('songs',{keyPath:'id',autoIncrement:true});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=(m,fn)=>new Promise((res,rej)=>{const t=db.transaction('songs',m),s=t.objectStore('songs'),r=fn(s);t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)});
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
const clean=n=>n.replace(/\.[^.]+$/,'').replace(/_+/g,' ').trim();
function split(n){const c=clean(n),k=c.indexOf(' - ');return k>0?[c.slice(k+3).trim(),c.slice(0,k).trim()]:[c,'ملفاتي']}
async function load(){try{db=await open();songs=await tx('readonly',s=>s.getAll())}catch(e){songs=[]}render()}
function render(){const q=$('q').value.trim().toLowerCase(),L=$('list');L.innerHTML='';
  if(!songs.length){L.innerHTML='<div class="empty">ما عندك أغاني بعد.<br>اضغط «أضف أغاني» واختر ملفات من الجوال.<br>تنحفظ في المتصفح وتبقى لك.</div>';return}
  songs.forEach((s,i)=>{if(q&&!s.name.toLowerCase().includes(q))return;
    const d=document.createElement('div');d.className='s'+(i===cur?' on':'');
    d.innerHTML=`<div class="i">${i===cur?EQ:IC.note}</div><div class="n"><span></span><small>${(s.size/1048576).toFixed(1)} MB</small></div><button class="x" aria-label="حذف">${IC.x}</button>`;
    d.querySelector('.n span').textContent=clean(s.name);
    d.onclick=e=>{if(e.target.closest('.x'))return;play(i);openPl()};
    d.querySelector('.x').onclick=async()=>{if(!confirm('حذف «'+clean(s.name)+'»؟'))return;await tx('readwrite',st=>st.delete(s.id));
      if(i===cur){a.pause();a.removeAttribute('src');cur=-1;document.body.classList.remove('has','playing');closePl()}else if(i<cur)cur--;songs.splice(i,1);render()};
    L.append(d)})}
function play(i){if(i<0||i>=songs.length)return;cur=i;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(songs[i].blob);a.src=url;a.playbackRate=SP[si];a.play().catch(()=>{});
  const[t,ar]=split(songs[i].name);$('ti').textContent=t;$('ar').textContent=ar;$('mt').textContent=t;document.body.classList.add('has');
  if('mediaSession'in navigator)navigator.mediaSession.metadata=new MediaMetadata({title:t,artist:ar});
  render()}
function next(auto){if(!songs.length)return;if(auto&&rep===2){a.currentTime=0;a.play();return}
  let n;if(shuf&&songs.length>1){do{n=Math.random()*songs.length|0}while(n===cur)}else{n=cur+1;if(n>=songs.length){if(rep===1||!auto)n=0;else{a.pause();return}}}play(n)}
function prev(){if(a.currentTime>3){a.currentTime=0;return}play(cur<=0?songs.length-1:cur-1)}
const toggle=()=>{if(cur<0){if(songs.length)play(0);return}a.paused?a.play():a.pause()};
const openPl=()=>$('pl').classList.add('on'),closePl=()=>$('pl').classList.remove('on');
$('add').onclick=()=>$('f').click();
$('f').onchange=async e=>{for(const f of [...e.target.files]){try{await tx('readwrite',s=>s.add({name:f.name,size:f.size,blob:f}))}catch(err){alert('تعذر حفظ '+f.name)}}e.target.value='';await load()};
$('q').oninput=render;
$('pp').onclick=toggle;$('mpp').onclick=e=>{e.stopPropagation();toggle()};
$('mini').onclick=openPl;$('cl').onclick=closePl;$('qu').onclick=closePl;
$('next').onclick=()=>next(false);$('prev').onclick=prev;
$('b10').onclick=()=>{a.currentTime=Math.max(0,a.currentTime-10)};$('f10').onclick=()=>{a.currentTime=Math.min(a.duration||1e9,a.currentTime+10)};
$('shf').onclick=()=>{shuf=!shuf;$('shf').classList.toggle('on',shuf)};
$('rep').onclick=()=>{rep=(rep+1)%3;$('rep').classList.toggle('on',rep>0);set('rep',rep===2?IC.rep1:IC.rep)};
$('spd').onclick=()=>{si=(si+1)%SP.length;a.playbackRate=SP[si];$('spd').querySelector('.sx').textContent=SP[si]+'×';$('spd').classList.toggle('on',SP[si]!==1)};
a.onplay=()=>{set('pp',IC.pause);set('mpp',IC.pause);document.body.classList.add('playing')};
a.onpause=()=>{set('pp',IC.play);set('mpp',IC.play);document.body.classList.remove('playing')};
a.onended=()=>next(true);
function prog(){const p=a.duration?a.currentTime/a.duration*100:0;$('seek').style.setProperty('--p',p+'%');if(!seeking)$('seek').value=p*10;$('tm').textContent=fmt(a.currentTime)+' / '+fmt(a.duration)}
a.ontimeupdate=prog;a.onloadedmetadata=prog;
$('seek').oninput=()=>{seeking=true;const v=$('seek').value/10;$('seek').style.setProperty('--p',v+'%');$('tm').textContent=fmt(v/100*a.duration)+' / '+fmt(a.duration)};
$('seek').onchange=()=>{if(a.duration)a.currentTime=$('seek').value/1000*a.duration;seeking=false};
if('mediaSession'in navigator){const m=navigator.mediaSession;m.setActionHandler('play',()=>a.play());m.setActionHandler('pause',()=>a.pause());
  m.setActionHandler('nexttrack',()=>next(false));m.setActionHandler('previoustrack',prev);
  try{m.setActionHandler('seekbackward',()=>{a.currentTime=Math.max(0,a.currentTime-10)});m.setActionHandler('seekforward',()=>{a.currentTime+=10});m.setActionHandler('seekto',d=>{a.currentTime=d.seekTime})}catch(e){}}
if(navigator.storage?.persist)navigator.storage.persist();
load();
</script></body></html>
